<header>
  <div class="header-container">
    <a class="marca" routerLink="/clubes">
      <span class="icono-pelota">⚽</span>
      <span class="texto-marca">F5<span class="marca-destacada">GOL</span></span>
    </a>
    <nav>
      <a class="nav-link" routerLink="/clubes" routerLinkActive="activo">Clubes</a>
      @if (auth.logueado()) {
        <div class="usuario-badge">
          <span class="usuario-avatar">{{ auth.usuario()?.name?.charAt(0) || 'U' }}</span>
          <span class="usuario-nombre">{{ auth.usuario()?.name }}</span>
        </div>
        <button class="btn-salir" (click)="salir()">Salir</button>
      } @else {
        <a class="btn-login-nav" routerLink="/login" routerLinkActive="activo">Ingresar</a>
      }
    </nav>
  </div>
</header>

<main>
  <router-outlet />
</main>
