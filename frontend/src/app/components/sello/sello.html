<svg class="sello" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
  <defs>
    <clipPath [attr.id]="recorte + '-cuadrado'"><rect width="64" height="64" rx="14" /></clipPath>
    <clipPath [attr.id]="recorte"><circle r="36" /></clipPath>
  </defs>

  <!-- Todo se recorta con el cuadrado: la pelota queda cortada por el borde, abajo a la derecha -->
  <g [attr.clip-path]="'url(#' + recorte + '-cuadrado)'">
    <rect width="64" height="64" class="sello-fondo" />

    <!-- La pelota ocupa la mitad del sello, en la esquina de abajo a la derecha -->
    <g transform="translate(48 48) scale(0.95)">
      <circle r="36" class="sello-cuero" />
      <g [attr.clip-path]="'url(#' + recorte + ')'" class="sello-gajos">
        <polygon points="0,-12 11.4,-3.7 7.1,9.7 -7.1,9.7 -11.4,-3.7" />
        <polygon points="0,-40 13,-30 6,-22 -6,-22 -13,-30" />
        <polygon points="36,-14 40,4 28,8 24,-4 26,-16" />
        <polygon points="24,30 12,40 4,30 12,20 24,22" />
        <polygon points="-24,30 -12,40 -4,30 -12,20 -24,22" />
        <polygon points="-36,-14 -40,4 -28,8 -24,-4 -26,-16" />
      </g>
      <g class="sello-costuras">
        <line x1="0" y1="-12" x2="0" y2="-22" />
        <line x1="11.4" y1="-3.7" x2="24" y2="-4" />
        <line x1="7.1" y1="9.7" x2="12" y2="20" />
        <line x1="-7.1" y1="9.7" x2="-12" y2="20" />
        <line x1="-11.4" y1="-3.7" x2="-24" y2="-4" />
      </g>
    </g>
  </g>

  <!-- "F5" arriba a la izquierda, blanco con borde tinta como la pelota: el borde va por debajo del relleno (paint-order) -->
  <text x="22" y="31" text-anchor="middle" class="sello-texto">F5</text>
</svg>
