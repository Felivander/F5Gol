<svg class="campo" [class.mini]="mini()" viewBox="0 0 400 240" role="img" [attr.aria-label]="'Dibujo de una cancha de ' + textoTipo()">
  <rect width="400" height="240" class="campo-pasto" />
  @for (franja of [0, 2, 4, 6, 8]; track franja) {
    <rect [attr.x]="franja * 40" y="0" width="40" height="240" class="campo-franja" />
  }
  <g class="campo-lineas">
    <rect x="20" y="16" width="360" height="208" rx="2" />
    <line x1="200" y1="16" x2="200" y2="224" />
    <circle cx="200" cy="120" r="34" />
    <path d="M20 66h46a10 10 0 0 1 10 10v88a10 10 0 0 1-10 10H20" />
    <path d="M380 66h-46a10 10 0 0 0-10 10v88a10 10 0 0 0 10 10h46" />
    <rect x="10" y="98" width="10" height="44" />
    <rect x="380" y="98" width="10" height="44" />
  </g>
  <circle cx="200" cy="120" r="3" class="campo-punto" />
  <circle cx="58" cy="120" r="2.5" class="campo-punto" />
  <circle cx="342" cy="120" r="2.5" class="campo-punto" />
</svg>
