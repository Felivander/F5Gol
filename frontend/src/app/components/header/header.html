<header class="barra">
  <div class="barra-interior">
    <a class="marca" routerLink="/clubes" aria-label="F5GOL, ir al inicio">
      <span class="marca-sello" aria-hidden="true">F5</span>
      <span class="marca-nombre">F5GOL</span>
    </a>

    <nav class="navegacion" aria-label="Principal">
      <a routerLink="/clubes" routerLinkActive="activo">Canchas</a>
      <a routerLink="/partidos" routerLinkActive="activo" class="nav-partidos">Partidos abiertos</a>
      @if (auth.logueado()) {
        <a routerLink="/mis-reservas" routerLinkActive="activo">Mis reservas</a>
        @if (auth.usuario()?.rol === 'administrador') {
          <a routerLink="/mis-clubes" routerLinkActive="activo">Mis clubes</a>
          <a routerLink="/panel" routerLinkActive="activo">Panel</a>
        }
      }
    </nav>

    <div class="sesion">
      @if (auth.logueado()) {
        <span class="usuario" [attr.title]="auth.usuario()?.name">
          <span class="usuario-inicial" aria-hidden="true">{{ inicial() }}</span>
          <span class="usuario-nombre">{{ primerNombre() }}</span>
        </span>
        <button type="button" class="boton-salir" (click)="salir()">
          <app-icono nombre="salir" [tamano]="16" />
          <span>Salir</span>
        </button>
      } @else {
        <a class="boton-ingresar" routerLink="/login">Ingresar</a>
      }
    </div>
  </div>
</header>
