<div class="login-card">
  <div style="text-align: center; margin-bottom: 1.25rem;">
    <span style="font-size: 2.5rem; display: inline-block; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));">⚽</span>
    <h1 style="font-size: 1.75rem; margin-top: 0.5rem;">Iniciar sesión</h1>
    <p class="login-subtitulo">Ingresá a tu cuenta para reservar canchas y gestionar tus turnos.</p>
  </div>

  <form class="formulario" (ngSubmit)="ingresar()">
    <div class="campo">
      <label for="email">Correo electrónico</label>
      <input
        id="email"
        name="email"
        type="email"
        placeholder="ejemplo@correo.com"
        autocomplete="email"
        [(ngModel)]="email"
        required>
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>
      <input
        id="password"
        name="password"
        type="password"
        placeholder="••••••••"
        autocomplete="current-password"
        [(ngModel)]="password"
        required>
    </div>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button type="submit" [disabled]="enviando()" style="width: 100%;">
      @if (enviando()) {
        <span>⚽ Ingresando...</span>
      } @else {
        <span>Ingresar a F5GOL →</span>
      }
    </button>
  </form>
</div>
