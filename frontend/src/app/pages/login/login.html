<div class="acceso">
  <div class="acceso-tarjeta">
    <div class="encabezado-texto">
      <h1>Ingresar</h1>
      <p class="bajada">Para reservar, sumarte a partidos y ver tus turnos.</p>
    </div>

    @if (error()) {
      <p class="alerta alerta-error" role="alert">
        <app-icono nombre="alerta" [tamano]="20" />
        {{ error() }}
      </p>
    }

    <form class="formulario" [formGroup]="form" (ngSubmit)="ingresar()" novalidate>
      <div class="campo">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" autocomplete="email" formControlName="email">
        @if (errorDe('email')) {
          <small class="error-campo">{{ errorDe('email') }}</small>
        }
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" formControlName="password">
        @if (errorDe('password')) {
          <small class="error-campo">{{ errorDe('password') }}</small>
        }
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="enviando()">
        {{ enviando() ? 'Ingresando…' : 'Ingresar' }}
      </button>
    </form>

    <app-boton-google />

    <p class="acceso-pie">¿No tenés cuenta? <a routerLink="/registro">Creá una</a></p>
  </div>
</div>
