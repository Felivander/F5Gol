<h1>Iniciar sesión</h1>

<form class="formulario" (ngSubmit)="ingresar()">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="email" [(ngModel)]="email" required>

  <label for="password">Contraseña</label>
  <input id="password" name="password" type="password" autocomplete="current-password" [(ngModel)]="password" required>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <button type="submit" [disabled]="enviando()">
    {{ enviando() ? 'Ingresando...' : 'Ingresar' }}
  </button>
</form>
